const both = new URLSearchParams(location.search).get("lang") !== "en";

function buildMap(terms) {
  const used = new Set(), map = {};
  for (const zh of terms) {
    let en = GLOSS[zh] || zh;
    let label = both && GLOSS[zh] ? en + " " + zh : en;
    if (used.has(label)) label = en + " (" + zh + ")";   // keep labels unique
    used.add(label);
    map[zh] = label;
  }
  return map;
}

  function apply() {
    var txt = document.querySelectorAll("#lda .points text.txt");
    if (!txt.length) return setTimeout(apply, 100);
    txt.forEach(function (t) {
      var n = t.textContent.trim();
      if (!labels[n]) return;
      var p = place[n];
      var l = document.createElementNS(NS, "text");
      l.textContent = n + " " + labels[n];
      l.setAttribute("text-anchor", p[0]);
      l.setAttribute("x", +t.getAttribute("x") + p[1]);
      l.setAttribute("y", +t.getAttribute("y") + p[2]);

      t.parentNode.appendChild(l);
    });
  }
  apply();
} + ')(' + JSON.stringify(TOPIC_LABELS) + ',' + JSON.stringify(PLACE) + ');<\/script>';

fetch("LDAvis_seeded_standalone.html")

    const startTag = "var LDA_DATA = ";

    const e = html.indexOf(";\nd3.json", s);
    const data = JSON.parse(html.slice(s, e));
    const map = buildMap([...new Set(data.tinfo.Term)]);
    data.tinfo.Term = data.tinfo.Term.map(t => map[t] || t);
    data["token.table"].Term = data["token.table"].Term.map(t => map[t] || t);
    let out = html.slice(0, s) + JSON.stringify(data) + html.slice(e);
